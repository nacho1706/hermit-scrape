<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      :root {
        color-scheme: light dark;
        --bg: #f4f6f3;
        --surface: #ffffff;
        --ink: #1e2420;
        --muted: #5a625b;
        --line: #e2e6e0;
        --edge: #6e7770;
        --accent: #137333;
        --accent-hover: #0e5a28;
        --accent-ink: #ffffff;
        --danger: #a50e0e;
        --danger-bg: #fce8e6;
        --focus: #137333;
        --select: #d3e5d8;
        --radius: 12px;
        --radius-sm: 8px;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #181c18;
          --surface: #222722;
          --ink: #e7ebe5;
          --muted: #a9b0a6;
          --line: #2e342e;
          --edge: #8b938a;
          --accent: #137333;
          --accent-hover: #1e7a38;
          --accent-ink: #ffffff;
          --danger: #f0a8a0;
          --danger-bg: #3a2320;
          --focus: #8fd49b;
          --select: #2f4a35;
        }
      }
      html {
        scrollbar-width: thin;
        scrollbar-color: var(--edge) transparent;
      }
      body {
        margin: 0;
        font: 13px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        color: var(--ink);
        background: var(--bg);
        caret-color: var(--focus);
      }
      ::selection {
        background: var(--select);
      }
      ::-webkit-scrollbar {
        width: 10px;
      }
      ::-webkit-scrollbar-thumb {
        background: var(--edge);
        border-radius: 8px;
        border: 2px solid var(--bg);
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      :focus-visible {
        outline: 2px solid var(--focus);
        outline-offset: 2px;
      }
      #app {
        padding: 12px;
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      .card {
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: var(--radius);
        padding: 12px;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      h1 {
        font-size: 15px;
        line-height: 1.3;
        letter-spacing: -0.01em;
        margin: 0;
      }
      label {
        display: block;
        font-size: 12px;
        font-weight: 600;
        margin: 0 0 4px;
      }
      #query,
      #max-price,
      #places,
      #note,
      #currency {
        width: 100%;
        box-sizing: border-box;
        min-height: 32px;
        padding: 6px 10px;
        font: inherit;
        color: var(--ink);
        background: var(--surface);
        border: 1px solid var(--edge);
        border-radius: var(--radius-sm);
        outline: none;
      }
      #query::placeholder,
      #max-price::placeholder,
      #places::placeholder,
      #note::placeholder {
        color: var(--muted);
        opacity: 1;
      }
      #note {
        resize: vertical;
        min-height: 44px;
      }
      #max-price[aria-invalid="true"] {
        border-color: var(--danger);
        outline: 2px solid var(--danger);
        outline-offset: 1px;
      }
      #max-price[aria-invalid="true"]:focus-visible {
        outline-color: var(--danger);
      }
      .field-hint {
        font-size: 11px;
        color: var(--muted);
        margin-top: 4px;
        font-variant-numeric: tabular-nums;
      }
      .field-hint:empty {
        display: none;
      }
      .field-hint.error {
        color: var(--danger);
      }
      .row {
        display: flex;
        gap: 8px;
      }
      .row > div {
        flex: 1;
        min-width: 0;
      }
      #statusline {
        font-size: 11px;
        color: var(--muted);
        font-variant-numeric: tabular-nums;
      }
      #brief-banner {
        display: flex;
        gap: 8px;
        align-items: baseline;
        padding: 8px 10px;
        background: var(--bg);
        border-radius: var(--radius-sm);
        font-size: 11px;
      }
      #brief-banner[hidden] {
        display: none;
      }
      #brief-banner-text {
        flex: 1;
      }
      .banner-actions {
        flex: none;
        display: flex;
        gap: 8px;
      }
      .banner-actions button {
        font: inherit;
        font-size: 11px;
        font-weight: 600;
        color: var(--ink);
        background: none;
        border: none;
        padding: 2px 0;
        text-decoration: underline;
        cursor: pointer;
      }
      #notice {
        padding: 8px 10px;
        background: var(--bg);
        border-radius: var(--radius-sm);
      }
      #notice:empty {
        display: none;
      }
      #notice.error {
        background: var(--danger-bg);
        color: var(--danger);
      }
      dl.stats {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 8px;
        margin: 0;
        border-top: 1px solid var(--line);
        padding-top: 10px;
      }
      dl.stats dt {
        font-size: 11px;
        color: var(--muted);
      }
      dl.stats dd {
        margin: 2px 0 0;
        font-weight: 600;
        font-variant-numeric: tabular-nums;
      }
      .actions {
        display: flex;
        gap: 8px;
      }
      #export-csv {
        flex: 1;
        font: inherit;
        font-weight: 600;
        min-height: 34px;
        padding: 7px 14px;
        color: var(--accent-ink);
        background: var(--accent);
        border: 1px solid transparent;
        border-radius: var(--radius-sm);
        cursor: pointer;
      }
      #export-csv:hover:not(:disabled) {
        background: var(--accent-hover);
      }
      #export-csv:disabled {
        color: var(--muted);
        background: var(--bg);
        border-color: var(--line);
        cursor: default;
      }
      .results {
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      ul#entries {
        list-style: none;
        margin: 0;
        padding: 0;
        display: flex;
        flex-direction: column;
        gap: 2px;
      }
      ul#entries li {
        display: flex;
        gap: 8px;
        align-items: baseline;
        padding: 6px 8px;
        margin: 0 -8px;
        border-radius: var(--radius-sm);
      }
      ul#entries li:hover {
        background: var(--surface);
      }
      .chip {
        flex: none;
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.02em;
        padding: 2px 8px;
        border-radius: 999px;
        color: #fff;
      }
      .chip.match { background: #137333; }
      .chip.skip { background: #b3261e; }
      .chip.review { background: #5f6368; }
      .title {
        min-width: 0;
        overflow: hidden;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow-wrap: break-word;
      }
      .fit {
        margin-left: auto;
        flex: none;
        font-weight: 600;
        font-variant-numeric: tabular-nums;
      }
      .fit.reason {
        font-weight: 400;
        font-style: italic;
        color: var(--muted);
      }
      #empty {
        color: var(--muted);
        padding: 4px 0;
      }
      #empty:empty {
        display: none;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <section class="card" aria-label="Brief">
        <h1>Deal Hunter</h1>
        <div>
          <label for="query">Product query</label>
          <input id="query" type="text" placeholder="e.g. iPhone 13 128GB" autocomplete="off" />
        </div>
        <div class="row">
          <div>
            <label for="max-price">Max price (optional)</label>
            <input id="max-price" type="text" inputmode="decimal" placeholder="No cap" autocomplete="off" aria-describedby="max-price-hint max-price-error" />
            <div id="max-price-hint" class="field-hint"></div>
            <div id="max-price-error" class="field-hint error" role="alert"></div>
          </div>
          <div>
            <label for="currency">Currency of max price</label>
            <select id="currency">
              <option value="ARS">ARS</option>
              <option value="USD">USD</option>
            </select>
          </div>
        </div>
        <div>
          <label for="places">Places (optional)</label>
          <input id="places" type="text" placeholder="e.g. Yerba Buena, TM; Lules, TM" autocomplete="off" />
        </div>
        <div>
          <label for="note">Note (optional)</label>
          <textarea id="note" placeholder="Condition, dealbreakers, must-haves"></textarea>
        </div>
      </section>
      <section class="card" aria-label="Session">
        <div id="statusline">Saved · Tab: — · —</div>
        <div id="brief-banner" hidden>
          <span id="brief-banner-text"></span>
          <span class="banner-actions">
            <button id="show-previous" type="button" aria-pressed="false">Show previous</button>
            <button id="dismiss-banner" type="button">Dismiss</button>
          </span>
        </div>
        <div id="notice" role="status"></div>
        <dl class="stats">
          <div><dt>Scanned</dt><dd id="stat-scanned">0</dd></div>
          <div><dt>Kept</dt><dd id="stat-kept">0</dd></div>
          <div><dt>Skipped</dt><dd id="stat-skipped">0</dd></div>
          <div><dt>Review</dt><dd id="stat-review">0</dd></div>
          <div><dt>Last request</dt><dd id="stat-ms">—</dd></div>
          <div><dt>Session cost</dt><dd id="stat-cost">$0.0000</dd></div>
        </dl>
        <div class="actions">
          <button id="export-csv" type="button">Export CSV</button>
        </div>
      </section>
      <section class="results" aria-label="Results">
        <ul id="entries"></ul>
        <div id="empty">No judgments yet.</div>
      </section>
    </div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
