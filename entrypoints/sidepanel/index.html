<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      body {
        margin: 0;
        font: 13px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        color: #1f1f1f;
        background: #fff;
      }
      #app {
        padding: 12px;
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      h1 {
        font-size: 14px;
        margin: 0;
      }
      label {
        display: block;
        font-weight: 600;
        margin-bottom: 4px;
      }
      #query {
        width: 100%;
        box-sizing: border-box;
        padding: 6px 8px;
        font: inherit;
      }
      #notice {
        padding: 8px;
        background: #f1f3f4;
        border-radius: 4px;
      }
      #notice:empty {
        display: none;
      }
      #notice.error {
        background: #fce8e6;
        color: #a50e0e;
      }
      dl.stats {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 4px 8px;
        margin: 0;
      }
      dl.stats dt {
        font-size: 11px;
        color: #444;
      }
      dl.stats dd {
        margin: 0;
        font-weight: 600;
        font-variant-numeric: tabular-nums;
      }
      ul#entries {
        list-style: none;
        margin: 0;
        padding: 0;
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      ul#entries li {
        display: flex;
        gap: 8px;
        align-items: baseline;
      }
      .chip {
        flex: none;
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.02em;
        padding: 1px 6px;
        border-radius: 999px;
        color: #fff;
      }
      .chip.match { background: #137333; }
      .chip.skip { background: rgba(179, 38, 30, 0.82); }
      .chip.review { background: #5f6368; }
      .title {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .fit {
        margin-left: auto;
        flex: none;
        font-variant-numeric: tabular-nums;
        color: #444;
      }
      #empty {
        color: #444;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <h1>Deal Hunter</h1>
      <div>
        <label for="query">Product query</label>
        <input id="query" type="text" placeholder="e.g. iPhone 13 128GB" autocomplete="off" />
      </div>
      <div id="notice" role="status"></div>
      <dl class="stats">
        <div><dt>Scanned</dt><dd id="stat-scanned">0</dd></div>
        <div><dt>Kept</dt><dd id="stat-kept">0</dd></div>
        <div><dt>Skipped</dt><dd id="stat-skipped">0</dd></div>
        <div><dt>Review</dt><dd id="stat-review">0</dd></div>
        <div><dt>Last request</dt><dd id="stat-ms">—</dd></div>
        <div><dt>Session cost</dt><dd id="stat-cost">$0.0000</dd></div>
      </dl>
      <ul id="entries"></ul>
      <div id="empty">No judgments yet.</div>
    </div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
