<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      body {
        margin: 0;
        font: 13px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        color: #1f1f1f;
        background: #fff;
      }
      #app {
        max-width: 480px;
        padding: 24px;
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      h1 {
        font-size: 16px;
        margin: 0;
      }
      label {
        display: block;
        font-weight: 600;
        margin-bottom: 4px;
      }
      #key {
        width: 100%;
        box-sizing: border-box;
        padding: 6px 8px;
        font: inherit;
      }
      .row {
        display: flex;
        gap: 8px;
      }
      button {
        font: inherit;
        padding: 6px 12px;
      }
      #status {
        color: #444;
      }
      #status:empty {
        display: none;
      }
      p.hint {
        margin: 0;
        color: #444;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <h1>Deal Hunter options</h1>
      <div>
        <label for="key">OpenRouter key</label>
        <input id="key" type="password" placeholder="Paste key" autocomplete="off" spellcheck="false" />
      </div>
      <div class="row">
        <button id="save" type="button">Save key</button>
        <button id="clear" type="button">Remove key</button>
      </div>
      <div id="status" role="status"></div>
      <p class="hint">The key stays in this browser. Scoring bills your own OpenRouter account.</p>
    </div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
